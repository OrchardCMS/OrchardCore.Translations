name: Translation skill

on:
  pull_request:
    paths:
      - '.github/skills/orchardcore-translations/**'
      - '.github/workflows/translation-skill.yml'
  push:
    branches: [ main ]
    paths:
      - '.github/skills/orchardcore-translations/**'
      - '.github/workflows/translation-skill.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r .github/skills/orchardcore-translations/scripts/requirements.txt
      - name: Run translation regression tests
        run: python -m unittest discover -s .github/skills/orchardcore-translations/scripts -p 'test_*.py'
